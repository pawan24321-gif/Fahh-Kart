{% extends 'base.html' %}

{% block content %}

<div class="product-container">

    <div class="product-image">
        <img src="{{ url_for('static',
        filename='images/' + product.image) }}">
    </div>

    <div class="product-info">

        <h1>{{ product.name }}</h1>

        <h2>₹{{ product.price }}</h2>

        <p>{{ product.description }}</p>

        <a href="/add-to-cart/{{ product.id }}">
            <button class="cart-btn">
                Add To Cart
            </button>
        </a>

    </div>

</div>

{% endblock %}
